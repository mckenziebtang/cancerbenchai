name: CancerBench checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cancerbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 15
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: cancerbench_test
          POSTGRES_USER: cancerbench
          POSTGRES_PASSWORD: cancerbench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cancerbench -d cancerbench_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_TEST_URL: redis://localhost:6379/15
      POSTGRES_TEST_URL: postgresql://cancerbench:cancerbench@localhost:5432/cancerbench_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax and whitespace checks
        run: python scripts/check_source.py
      - name: Lint
        run: python -m ruff check .
      - name: Unit, API, Redis, and pgvector tests
        run: python -m pytest -q --junitxml=reports/tests.xml
      - name: Frontend interaction checks
        run: node --test tests/frontend.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: cancerbench-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Compose configuration
        run: docker compose --profile monitoring config --quiet
      - name: Build and start real services
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Full workflow and cache hit with isolated synthetic literature
        run: python scripts/compose_smoke.py --seed-fixture
      - name: Collect Compose logs
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-logs
          path: reports/
      - name: Stop isolated CI services
        if: always()
        run: docker compose down -v

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit production dependencies
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit -r requirements.txt
      - name: Scan repository for committed secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2 dir /repo --redact --exit-code 1

  release-checks:
    runs-on: ubuntu-latest
    if: always()
    needs: [tests, compose, security]
    steps:
      - name: Require every release check
        env:
          TESTS: ${{ needs.tests.result }}
          COMPOSE: ${{ needs.compose.result }}
          SECURITY: ${{ needs.security.result }}
        run: test "$TESTS" = success && test "$COMPOSE" = success && test "$SECURITY" = success
