name: Test prediction service

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: cancerbench_test
          POSTGRES_USER: cancerbench
          POSTGRES_PASSWORD: cancerbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cancerbench -d cancerbench_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      REDIS_TEST_URL: redis://localhost:6379/15
      POSTGRES_TEST_URL: postgresql://cancerbench:cancerbench@localhost:5432/cancerbench_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag cancerbench-prediction:test .
